name: Verify launch candidate
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: crm_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: file:./dev.db
      DIRECT_URL: postgresql://crm_test:local-ci-test-only@127.0.0.1:5432/crm_test?schema=crm&sslmode=disable
      TEST_POSTGRES_URL: postgresql://crm_test:local-ci-test-only@127.0.0.1:5432/crm_test?schema=crm&sslmode=disable
      SESSION_SECRET: local-ci-only-long-session-secret-at-least-32-characters
      SEED_DEMO_DATA: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres
      - run: npm audit --audit-level=moderate
      - run: npm run build
